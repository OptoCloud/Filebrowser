name: ci

on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs every check here before it builds anything it would publish.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install pnpm (version and hash from packageManager)
        run: ../.github/ci/install-pnpm.sh package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run test:unit --run
      - run: pnpm run build
      - run: pnpm audit --prod --audit-level moderate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: web/build

  go:
    needs: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: filebrowser
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: filebrowser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filebrowser" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FB_TEST_DATABASE_URL: postgres://filebrowser:ci@localhost:5432/filebrowser?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: web/build
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Test on Debian 13 (deployment target)
        run: |
          # Ubuntu runners restrict unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          go mod download
          docker run --rm --network host \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e FB_TEST_DATABASE_URL \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$(go env GOROOT):/usr/local/go:ro" -v "$(go env GOMODCACHE):/gomod:ro" \
            debian:13@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2 bash /src/.github/ci/debian-test.sh
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -exclude-generated ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o dist/filebrowser ./cmd/filebrowser

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.187.0@sha256:0c8dfa7aa1ca8c50233ec9110e8cd88d139dedd603d56507493f74c6f4b3e062
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/golang --config p/javascript --config p/secrets --error

  windows:
    # Windows is a supported target: run the suite there too, including the
    # AppContainer sandbox test, against the runner's preinstalled PostgreSQL.
    needs: web
    runs-on: windows-latest
    env:
      FB_TEST_DATABASE_URL: postgres://postgres:root@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: web/build
      - name: Start PostgreSQL and install ffmpeg
        shell: pwsh
        run: |
          Get-Service postgresql* | Set-Service -StartupType Manual -PassThru | Start-Service
          choco install ffmpeg -y --no-progress
          # Put the real ffmpeg ahead of Chocolatey's shim: the shim starts
          # ffmpeg as a child process, which the sandbox's one-process job
          # limit forbids.
          $bin = (Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: go test -count=1 ./...
