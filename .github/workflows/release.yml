name: release

# Push a tag like v1.2.3 on master to publish a release: every check in ci.yml, then the
# binaries, attested and published, then the image. The LXC updater (deploy/lxc/filebrowser-update)
# installs the newest release from here; orion gets it from the hosts repo, whose
# deploy-filebrowser workflow this hands the tag to, and which pins and installs it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # the attestation's signing certificate
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The tag becomes the version hosts pins, and hosts refuses any other shape.
      # Only reviewed code deploys: a tag on a commit master does not contain is refused.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vMAJOR.MINOR.PATCH, got $TAG"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "$TAG is not on master"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # what is published is built from nothing but the tagged tree
      - name: Build web
        working-directory: web
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" -o dist/filebrowser-linux-$arch ./cmd/filebrowser
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=$VERSION" -o dist/filebrowser-windows-amd64.exe ./cmd/filebrowser
          tar -czf dist/deploy.tar.gz deploy
          (cd dist && sha256sum filebrowser-* deploy.tar.gz > SHA256SUMS && cat SHA256SUMS)
      # Proves each file came from this workflow at this tag. hosts' deploy-filebrowser verifies
      # it before pinning anything, so a file uploaded to the release by hand is never deployed.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/filebrowser-*
            dist/deploy.tar.gz
      - name: Sign checksums
        # Optional: an SSH signing key (private key in the RELEASE_SSH_KEY secret).
        # Hosts that have /etc/filebrowser/release_signers refuse unsigned releases.
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        if: env.RELEASE_SSH_KEY != ''
        run: |
          umask 077
          printf '%s\n' "$RELEASE_SSH_KEY" > "$RUNNER_TEMP/key"
          ssh-keygen -Y sign -f "$RUNNER_TEMP/key" -n filebrowser-release dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes dist/*
      # HOSTS_DISPATCH_TOKEN: a fine-grained token for OptoCloud/hosts only, Contents: read and
      # write, which is the least repository_dispatch accepts. It can start hosts' workflows;
      # it cannot reach orion, which only hosts' own secrets can.
      - name: Hand the release to hosts
        env:
          GH_TOKEN: ${{ secrets.HOSTS_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh api repos/OptoCloud/hosts/dispatches -f event_type=filebrowser-release -f "client_payload[tag]=$TAG"

  image:
    # Docker image (Debian 13 slim) for linux/amd64 and linux/arm64, only once the release is out.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build and push
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .
